name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # The native input helper is a Swift binary, so the package is built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install trusted publishing npm
        run: npm install --global npm@11
      - run: npm ci
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version."
            exit 1
          fi
      - name: Check npm publish status
        id: npm_status
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view screenstudio-mcp version 2>/dev/null || true)"
          if [ "$version" = "$published" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "screenstudio-mcp@$version is already on npm; skipping."
          fi
      - name: Publish
        if: steps.npm_status.outputs.already_published != 'true'
        run: npm publish --provenance
