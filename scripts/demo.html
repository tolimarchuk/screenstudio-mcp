<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Studio MCP Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#f5f6fa;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1000px;margin:70px auto;padding:40px}small{color:#a2afff;font-weight:650;letter-spacing:.12em}h1{font-size:58px;line-height:1.06;letter-spacing:-.05em;max-width:720px;margin:22px 0}p{font-size:21px;color:#a9b1c3;line-height:1.6}section{margin-top:44px;padding:28px;background:#1b2030;border:1px solid #30394f;border-radius:20px;display:flex;align-items:center;gap:20px}button{background:#b5c0ff;color:#141824;border:0;border-radius:12px;padding:15px 22px;font:600 16px -apple-system;cursor:pointer}input{background:#101622;border:1px solid #3a4663;border-radius:12px;padding:15px;color:#f5f6fa;font:16px -apple-system;flex:1}#status{font-size:20px;min-height:30px;color:#adf2d2}footer{padding:80px 0 20px;color:#6c7895}button:focus,input:focus{outline:3px solid #718cff;outline-offset:3px}
</style><main><small>SCREEN STUDIO MCP</small><h1>Sample app</h1><p>Sample data for repeatable recording tests.</p><section><input aria-label="Demo title" placeholder="Name your walkthrough"><button id="create">Create demo</button></section><p id="status" aria-live="polite">Ready when you are.</p><button id="details">Show workflow</button><p id="workflow" hidden>Record → perform the walkthrough → trim → frame → inspect → export.</p><footer>Local sample page · No account · No network requests</footer></main><script>
document.querySelector('#create').onclick=()=>{const title=document.querySelector('input').value.trim()||'Product walkthrough';document.querySelector('#status').textContent=title+' is ready to record.'};document.querySelector('#details').onclick=()=>{document.querySelector('#workflow').hidden=!document.querySelector('#workflow').hidden};
</script></html>
